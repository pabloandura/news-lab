name: news_lab
description: A news app with journalist article publishing.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  ionicons: ^0.2.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1

  # state management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # service locator
  get_it: ^8.0.3

  # date formatting
  intl: ^0.20.2

  # local database (bookmarks)
  floor: ^1.4.0
  sqflite: ^2.3.0

  # http client + rest codegen
  dio: ^5.8.0+1
  retrofit: ^4.4.1

  # Firebase
  firebase_core: ^3.13.1
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  firebase_auth: ^5.5.3

  # UI utilities
  flutter_hooks: ^0.21.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # uuid for article IDs
  uuid: ^4.5.1
  crypto: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  retrofit_generator: 8.1.0
  floor_generator: ^1.4.2
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  fonts:
    - family: Muli
      fonts:
        - asset: assets/fonts/muli/Muli.ttf
        - asset: assets/fonts/muli/Muli-Bold.ttf
          weight: 700
        - asset: assets/fonts/muli/Muli-Light.ttf
          weight: 300
