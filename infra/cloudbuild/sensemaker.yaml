steps:
  - name: node:20
    id: install-types
    dir: types
    args: ['npm', 'ci']

  - name: node:20
    id: install
    dir: services/sensemaker
    args: ['npm', 'ci']

  - name: node:20
    id: typecheck
    dir: services/sensemaker
    args: ['npx', 'tsc', '--noEmit']
    waitFor: ['install-types', 'install']

  - name: node:20
    id: test
    dir: services/sensemaker
    args: ['npm', 'test']
    waitFor: ['typecheck']

  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/sensemaker:$COMMIT_SHA
      - services/sensemaker
    waitFor: ['test']

  - name: gcr.io/cloud-builders/docker
    id: push
    args: ['push', 'gcr.io/$PROJECT_ID/sensemaker:$COMMIT_SHA']
    waitFor: ['build']

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    args:
      - gcloud
      - run
      - deploy
      - sensemaker
      - --image=gcr.io/$PROJECT_ID/sensemaker:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --no-allow-unauthenticated
    waitFor: ['push']

# Trigger config:
#   includedFiles: ['services/sensemaker/**', 'types/**']
#   branch: ^main$
